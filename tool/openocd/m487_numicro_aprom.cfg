# M487 Flash Config - Use numicroM4 target with APROM @ 0x10000000
#
# Override flash base from 0x00000000 to 0x10000000 (physical address)

# Load the base numicroM4 target (this creates flash banks)
source [find target/numicroM4.cfg]

# Override for M487
set CHIPNAME M487
set CPUDAPID 0x2BA01477
set WORKAREASIZE 0x4000

# Delete the existing APROM flash bank (created by numicroM4.cfg with base 0x00000000)
# and recreate with physical address 0x10000000
flash bank M487.aprom numicro 0x10000000 0x80000 0 0 M487.cpu