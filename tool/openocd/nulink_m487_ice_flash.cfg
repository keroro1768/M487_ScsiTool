# OpenOCD Config for M487 via Nu-Link (First Gen) - With Flash Bank
# Compatible with openocd-build (0.12.0+dev 2026-03-25)
#
# Flash: M487 APROM 512KB @ 0x10000000
# Add flash bank command BEFORE init (numicro driver)

adapter driver hla
hla layout nulink
hla vid_pid 0x0416 0x511C
transport select swd

# M487 SWD DP-ID = 0x2BA01477
swd newdap M487 cpu -expected-id 0x2BA01477
dap create M487.dap -chain-position M487.cpu
target create M487.cpu cortex_m -dap M487.dap

# Flash bank for M487 APROM @ 0x10000000 (512KB)
# Must be defined BEFORE init
flash bank M487.aprom numicro 0x10000000 0x80000 0 0 M487.cpu

# Optional: set clock speed (kHz)
adapter speed 4000