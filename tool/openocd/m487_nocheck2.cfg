# M487 OpenOCD config - NO IDCODE check at all
adapter driver hla
hla layout nulink
hla vid_pid 0x0416 0x511C
transport select swd

# Don't use swd newdap at all - let OpenOCD auto-detect
# Just create target directly
transport init
hla newtap M487 cpu -irlen 4
dap create M487.dap -chain-position M487.cpu
target create M487.cpu cortex_m -dap M487.dap -dap M487.dap
M487.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000

# M487 has 512KB APROM @ 0x0
flash bank M487.flash numicro 0x00000000 0 0 0 M487.cpu

adapter speed 4000