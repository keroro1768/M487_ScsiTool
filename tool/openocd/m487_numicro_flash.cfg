# M487 Flash Config - Separate adapter and target
# Load target file after adapter setup

source [find target/numicroM4.cfg]

# Override CHIPNAME for M487
set CHIPNAME M487
set CPUDAPID 0x2BA01477
set WORKAREASIZE 0x4000

# Add flash bank for APROM @ 0x10000000 after target is created
# Note: numicroM4.cfg already creates flash banks @ 0x00000000
# We need to override to use physical address 0x10000000

# First, delete existing APROM flash bank if any
# Then create new one with physical address
flash bank M487.aprom numicro 0x10000000 0x80000 0 0 M487.cpu