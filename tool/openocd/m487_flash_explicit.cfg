# M487 Flash Programming - explicit flash params
# Based on nulink_m487_ice.cfg + manual flash bank with explicit size

adapter driver hla
hla layout nulink
hla vid_pid 0x0416 0x511C
transport select swd

# M487 SWD DP-ID = 0x2BA01477
swd newdap M487 cpu -expected-id 0x2BA01477
dap create M487.dap -chain-position M487.cpu
target create M487.cpu cortex_m -dap M487.dap

# Work-area RAM for flash operations (16KB @ 0x20000000)
M487.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000

# Flash bank with explicit size (512KB = 0x80000)
flash bank M487.aprom numicro 0x10000000 0x80000 0 0 M487.cpu

adapter speed 4000