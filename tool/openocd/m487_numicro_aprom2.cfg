# M487 Flash Config - Use numicroM4 target with APROM @ 0x10000000
# Adapter setup first, then load target

adapter driver hla
hla layout nulink
hla vid_pid 0x0416 0x511C
transport select swd

# Load the base numicroM4 target (this creates flash banks)
source [find target/numicroM4.cfg]

# Override for M487
set CHIPNAME M487
set CPUDAPID 0x2BA01477
set WORKAREASIZE 0x4000

# Note: numicroM4.cfg already creates flash banks with base addresses
# APROM is at 0x00000000 (alias), but physical is 0x10000000
# We'll use the alias address for now