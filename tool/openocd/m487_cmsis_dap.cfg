# OpenOCD Config for M487 via Nu-Link (CMSIS-DAP)
# Compatible with openocd_cmsis-dap.exe

# Interface: CMSIS-DAP
adapter driver cmsis-dap
transport select swd

# VID/PID for Nuvoton Nu-Link
cmsis_dap_vid_pid 0x0416 0x511C

# Target: M487 custom config (dap-based)
source D:/AiWorkSpace/M487_ScsiTool/tool/openocd/m487_target.cfg
