# M487 Flash - Force APROM bank with explicit base
# Use with OpenOCD build 0.12.0+dev
#
# M487 APROM is at physical address 0x10000000
# But can also be accessed via alias 0x00000000 after boot remapping

adapter driver hla
hla layout nulink
hla vid_pid 0x0416 0x511C
transport select swd

swd newdap M487 cpu -expected-id 0x2BA01477
dap create M487.dap -chain-position M487.cpu
target create M487.cpu cortex_m -dap M487.dap

# Force flash bank to use explicit base address
# chip_width=0 means auto, bus_width=0 means auto
# Using physical address 0x10000000
flash bank M487.aprom numicro 0x10000000 0x80000 0 0 M487.cpu

adapter speed 4000