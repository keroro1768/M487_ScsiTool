# M487 Flash - Direct program without flash bank pre-config
# Use physical address 0x10000000 directly with program command

adapter driver hla
hla layout nulink
hla vid_pid 0x0416 0x511C
transport select swd

swd newdap M487 cpu -expected-id 0x2BA01477
dap create M487.dap -chain-position M487.cpu
target create M487.cpu cortex_m -dap M487.dap

# Work area for flash operations
M487.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000

# Don't pre-configure flash bank - let program command handle it
# flash bank will be auto-created on first flash access

adapter speed 4000