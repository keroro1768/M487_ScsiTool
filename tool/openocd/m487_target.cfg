# OpenOCD Target Config for Nuvoton M487 (CMSIS-DAP compatible)
# Compatible with openocd_cmsis-dap.exe (OpenOCD 0.12.x)

# Set Chipname
if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME M487
}

# SWD DP-ID Nuvoton M487 = 0x2BA01477
if { [info exists CPUDAPID] } {
    set _CPUDAPID $CPUDAPID
} else {
    set _CPUDAPID 0x2BA01477
}

# Work-area size (128KB SRAM)
if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x20000
}

# Create DAP and target (using OpenOCD 0.12.x DAP syntax)
swd newdap $_CHIPNAME cpu -expected-id $_CPUDAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# M487 Flash banks
set _FLASHNAME $_CHIPNAME.flash_aprom
flash bank $_FLASHNAME numicro 0x00000000 0 0 0 $_TARGETNAME
set _FLASHNAME $_CHIPNAME.flash_data
flash bank $_FLASHNAME numicro 0x0001F000 0 0 0 $_TARGETNAME
set _FLASHNAME $_CHIPNAME.flash_ldrom
flash bank $_FLASHNAME numicro 0x00100000 0 0 0 $_TARGETNAME
set _FLASHNAME $_CHIPNAME.flash_sprom
flash bank $_FLASHNAME numicro 0x00200000 0 0 0 $_TARGETNAME
set _FLASHNAME $_CHIPNAME.flash_config
flash bank $_FLASHNAME numicro 0x00300000 0 0 0 $_TARGETNAME
set _FLASHNAME $_CHIPNAME.flash_dfmc_data
flash bank $_FLASHNAME numicro 0x00400000 0 0 0 $_TARGETNAME

# Default speed
adapter speed 4000

# Reset configuration
reset_config none

# Soft reset
cortex_m reset_config sysresetreq

proc exitDebugging {} {
    shutdown
}
$_TARGETNAME configure -event gdb-detach { exitDebugging }
